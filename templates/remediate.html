<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Remediate Vulnerabilities - {{ artifact_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }
        .spinner-center {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            padding: 40px;
        }
        .status-badge {
            font-size: 0.9rem;
            padding: 0.4em 0.8em;
            border-radius: 0.5rem;
        }
        .fade-in {
            animation: fadeIn 0.6s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .in-progress {
            color: #0d6efd;
        }
        .status-table td {
            vertical-align: middle;
        }
        .loader-inline {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .table-container {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background-color: #fff;
        }
    </style>
</head>
<body>
<div class="container mt-5">

    <h2 class="mb-4">🛠️ Module: <span class="text-primary">{{ artifact_name }}</span></h2>

    <!-- Vulnerabilities Table -->
    <div id="vulnTable" class="mb-4"></div>

    <!-- Loader -->
    <div id="loaderSection" class="fade-in">
        <div class="spinner-center alert alert-info shadow-sm">
            <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
            <div>
                <h5 class="mb-0">Creating Pull Request...</h5>
                <div id="loaderMsg" class="small text-muted mt-1">
                    Initializing automated remediation workflow.
                </div>
            </div>
        </div>
    </div>

    <!-- Remediation Progress Table -->
    <div id="statusSection" class="d-none fade-in">
        <h4 class="mb-3">Remediation Progress</h4>
        <div class="table-container">
            <table class="table table-bordered text-center mb-0 status-table align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Pull Request</th>
                        <th>Status</th>
                        <th>Build</th>
                        <th>Dev Release</th>
                    </tr>
                </thead>
                <tbody>
                    <tr id="statusRow">
                        <td id="prCol">-</td>
                        <td id="statusCol">-</td>
                        <td id="buildCol">-</td>
                        <td id="releaseCol">-</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    const ARTIFACT_NAME = "{{ artifact_name }}";
</script>
<script src="{{ url_for('static', filename='js/remediate.js') }}"></script>
</body>
</html>
